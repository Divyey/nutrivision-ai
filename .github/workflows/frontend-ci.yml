# Frontend CI on development + production.
# Vercel preview: PRs and pushes to `development` → https://dev-nutrivision-ai.vercel.app
# Vercel production: pushes to `production` → promote so
#   https://prod-nutrivision-ai.vercel.app and https://nutrivision-ai-green.vercel.app move.
# Official pattern: https://vercel.com/kb/guide/how-can-i-use-github-actions-with-vercel
#
# GitHub secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID
# Link via those env vars. Run vercel from the repo root (project rootDirectory
# is frontend). Do not use --scope or vercel pull (pull 403s in CI with a
# token even when local `vercel login` pull works).
#
# Vercel project env:
#   VITE_API_BASE_URL  — https://nutrivision-ai-backend.fastapicloud.dev
#
# Git auto-deploy is off (vercel.json). Production domains are environment-bound
# with auto-assign disabled, so --prod must skip-domain then promote.

name: Frontend CI

on:
  pull_request:
    branches: [development, production]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [development, production]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc -b --pretty false

      - name: Install Vercel CLI
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        run: npm install --global vercel@latest

      - name: Deploy preview to Vercel
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.event_name == 'push' && github.ref == 'refs/heads/development')
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel frontend/.vercel
          vercel deploy --yes --token="$VERCEL_TOKEN"

      - name: Deploy production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/production'
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          rm -rf .vercel frontend/.vercel
          url="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          vercel promote "$url" --yes --token="$VERCEL_TOKEN"
