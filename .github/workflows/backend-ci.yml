# Backend CI on development + production.
# FastAPI Cloud production deploy only from branch `production`.
# Official pattern: https://fastapicloud.com/docs/advanced-features/deploy-tokens/
#
# GitHub secrets:
#   FASTAPI_CLOUD_TOKEN
#   FASTAPI_CLOUD_APP_ID
#
# FastAPI Cloud dashboard env:
#   DATABASE_URL, JWT_SECRET_KEY, CORS_ORIGINS
# Application Directory: backend
# Re-run: fastapi cloud setup-ci --secrets-only --branch production

name: Backend CI

on:
  pull_request:
    branches: [development, production]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [development, production]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET_KEY: github-actions-ci-only-not-for-production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: pytest -q

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Deploy to FastAPI Cloud
        working-directory: backend
        run: uv run --with "fastapi[standard]" fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
