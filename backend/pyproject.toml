[project]
name = "nutrivision-ai-backend"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "onnxruntime>=1.20.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "infrastructure*", "services*", "models*"]

[tool.setuptools.package-data]
models = ["food/*.onnx", "food/*.md"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.fastapi]
entrypoint = "main:app"
